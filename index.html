<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starter Web App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Starter Web App</h1>
    <p class="subtitle">A simple, no-build-tools starting point.</p>
  </header>

  <main class="content">
    <section class="card">
      <h2>Counter</h2>
      <p>Click the button to see some interactivity.</p>
      <p class="count" id="count">0</p>
      <button id="increment">Click me</button>
    </section>
  </main>

  <footer class="site-footer">
    <p>Edit <code>index.html</code>, <code>style.css</code>, and <code>script.js</code> to get started.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
